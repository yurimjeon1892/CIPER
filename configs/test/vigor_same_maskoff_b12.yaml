# configuration file for training
#----- base config
eval: True
pretrained: ./wandb/run-20240830_015414-hcycdn7s/files/model.pth

seed: 42
num_workers: 8

batch_size: 12 #12

device: cuda # device to use for training / testing 

# ----- data config
data_name: vigor
data_root: /data/experiment2/tmp/vigor/    

grd_img_size: [256, 1024]
arl_img_size: [512, 512]

shift_range_lat: 0 
shift_range_lon: 0 
rotation_range: 0 
fov: 0

same_area: True

# ----- model config
mask: False
num_multimask_outputs: 64

patch_size: 16
mlp_ratio: 4
qkv_bias: True

num_heads: 6 # Number of attention heads inside the transformer's attentions
num_enc_layers: 12 # Number of encoding layers in the transformer

dim_embed: 384 # Size of the embeddings (dimension of the transformer)
dim_feature: 1000

repeat_grd_factor: 3
grd_to_arl_factor: 1 # 360 / cam_fov

eval_name: run-20240830_015414-hcycdn7s