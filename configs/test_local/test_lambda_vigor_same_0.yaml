# configuration file for training
# ----- base config
eval: True
pretrained: ./wandb/run-20240216_021438-g81yhpdp/files/epoch_50.pth

seed: 42
num_workers: 8

batch_size: 32

device: cuda # device to use for training / testing 

# ----- data config
data_name: vigor
data_root: /data/VIGOR 

grd_img_size: [320, 640] 
arl_img_size: [320, 320]

rotation_range: 0

same_area: True
fov: 0

# ----- model config
num_queries: 128

patch_size: 16
mlp_ratio: 4
qkv_bias: True

num_heads: 6 # Number of attention heads inside the transformer's attentions
num_enc_layers: 12 # Number of encoding layers in the transformer

dim_embed: 384 # Size of the embeddings (dimension of the transformer)
dim_feature: 1000

repeat_grd_factor: 3
grd_to_arl_factor: 1 # 360 / cam_fov

# ----- misc
eval_name: vigor_same_0_e50