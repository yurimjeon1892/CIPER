# configuration file for test
# ----- base config
eval: True
pretrained: ./wandb/run-20240205_032304-6sykx4v9/files/epoch_32.pth

seed: 42
num_workers: 8
batch_size: 16

device: cuda # device to use for training / testing 

# ----- data config
data_name: kitti
data_root: /data/experiment2/tmp/kitti   

grd_img_size: [256, 1024]
arl_img_size: [512, 512]

shift_range_lat: 20 
shift_range_lon: 20 
rotation_range: 180 

train_pt_list: ./datasets/splits/kitti/train_files.txt
val_same_pt_list: ./datasets/splits/kitti/test1_files.txt
val_cross_pt_list: ./datasets/splits/kitti/test2_files.txt

# ----- model config
num_queries: 128

patch_size: 32
mlp_ratio: 4
qkv_bias: True

num_heads: 6 # Number of attention heads inside the transformer's attentions
num_enc_layers: 12 # Number of encoding layers in the transformer

dim_embed: 384 # Size of the embeddings (dimension of the transformer)
dim_feature: 1000

repeat_grd_factor: 3
grd_to_arl_factor: 4 # 360 / cam_fov

# ----- misc
eval_name: kitti_180_run-20240205_032304-6sykx4v9_e32
